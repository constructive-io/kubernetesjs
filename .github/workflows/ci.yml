name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  KUBERNETES_API_URL: http://127.0.0.1:8001

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.12.2

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    # Was two curls: kubectl from dl.k8s.io resolved through stable.txt, so the
    # version moved whenever upstream cut a release, and kind from
    # kind.sigs.k8s.io/dl — which redirects to GitHub releases, where an
    # unauthenticated download is rate-limited per IP and dies mid-transfer as
    # `curl: (56)`. It also pinned kind 0.20.0 while the rest of the repo used
    # 0.26.0.
    - name: Write cluster config
      run: |
        cat <<'EOF' > kind-config.yaml
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
        - role: control-plane
          extraPortMappings:
          - containerPort: 30000
            hostPort: 30000
            protocol: TCP
        EOF

    - name: Create Kind cluster
      uses: ./.github/actions/setup-kind
      with:
        config: kind-config.yaml
        wait: 5m
    
    - name: Wait for cluster to be ready
      run: |
        kubectl wait --for=condition=Ready nodes --all --timeout=300s
        kubectl wait --for=condition=Ready pods --all -n kube-system --timeout=300s
    
    - name: Start kubectl proxy
      run: kubectl proxy --port=8001 &

    - name: Run kubernetesjs tests
      working-directory: packages/kubernetesjs
      run: pnpm test
